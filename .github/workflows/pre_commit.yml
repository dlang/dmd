name: pre_commit

on:
  pull_request:
    branches:
      - master
      - stable
  push:
    branches:
      - master
      - stable
  workflow_dispatch:
  workflow_call:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      SKIP: no-commit-to-branch
    steps:
    - uses: actions/checkout@v7
    - name: Configure Git
      run: |
        git config --global color.diff.meta       "11"
        git config --global color.diff.frag       "magenta bold"
        git config --global color.diff.func       "146 bold"
        git config --global color.diff.commit     "yellow bold"
        git config --global color.diff.old        "red bold"
        git config --global color.diff.new        "green bold"
        git config --global color.diff.whitespace "red reverse"

        git config --global diff.wsErrorHighlight "all"
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install pre-commit
      run: |
        python -m pip install pre-commit
        python -m pip freeze --local
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run pre-commit
      run: pre-commit run --show-diff-on-failure --color=always --all-files
    - name: Check changelog entries
      run: |
        check_prefix="$(find changelog -type f -name '*\.dd' -a ! -name 'dmd\.*' -a ! -name 'druntime\.*')"
        if [ ! -z "${check_prefix}" ]; then
          echo 'All changelog entries must begin with either `dmd.` or `druntime.`'
          echo 'Found:'
          echo "${check_prefix}"
          exit 1
        fi
        check_ext="$(find changelog -type f ! -name 'README\.md' -a ! -name '*\.dd')"
        if [ ! -z "${check_ext}" ]; then
          echo 'All changelog entries must end with `.dd`'
          echo 'Found:'
          echo "${check_ext}"
          exit 1
        fi
